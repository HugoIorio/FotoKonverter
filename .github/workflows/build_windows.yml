name: Compilar FotoKonverter para Windows

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar Código em Executável com PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="assets/FotoKonverter.ico" --name="FotoKonverter" src/interface.py

    - name: Instalar Inno Setup e Compilar o Instalador
      run: |
        choco install innosetup
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/setup.iss

    - name: Anexar Instalador na Release do GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: Output/FotoKonverter_Setup_v1.0.0.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
