name: Compilar FotoKonverter para Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: FotoKonverter-x86_64.AppImage
            build_script: |
              sudo apt-get update
              sudo apt-get install -y python3-tk appstream
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pyinstaller
              pyinstaller --noconfirm --onedir --windowed --icon="assets/FotoKonverter.png" --name="FotoKonverter" src/interface.py

              mkdir -p AppDir/usr/bin
              mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
              mkdir -p AppDir/usr/share/applications

              cp -r dist/FotoKonverter/* AppDir/usr/bin/
              cp assets/FotoKonverter.png AppDir/usr/share/icons/hicolor/256x256/apps/FotoKonverter.png
              cp assets/FotoKonverter.png AppDir/FotoKonverter.png

              cat <<EOF > AppDir/FotoKonverter.desktop
              [Desktop Entry]
              Type=Application
              Name=FotoKonverter
              Exec=FotoKonverter
              Icon=FotoKonverter
              Categories=Graphics;Utility;
              Terminal=false
              EOF

              cat <<EOF > AppDir/AppRun
              #!/bin/sh
              HERE="\$(dirname "\$(readlink -f "\$0")")"
              exec "\$HERE/usr/bin/FotoKonverter" "\$@"
              EOF
              chmod +x AppDir/AppRun

              wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool-x86_64.AppImage
              chmod +x appimagetool-x86_64.AppImage
              ./appimagetool-x86_64.AppImage AppDir FotoKonverter-x86_64.AppImage

          - os: windows-latest
            artifact_name: Output/FotoKonverter_Setup_v1.0.0.exe
            build_script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pyinstaller
              pyinstaller --noconfirm --onedir --windowed --icon="assets/FotoKonverter.ico" --name="FotoKonverter" src/interface.py
              choco install innosetup
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/setup.iss

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compilar
      shell: bash
      run: |
        ${{ matrix.build_script }}

    - name: Anexar Arquivos na Release do GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: ${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}