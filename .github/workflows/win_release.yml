name: Build and Release for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --onedir --noconsole --name FotoKonverter --icon=assets/FotoKonverter.ico src/main.py

      - name: Copiar ícone para a pasta dist
        run: |
          Copy-Item "assets/FotoKonverter.ico" "dist/FotoKonverter/"

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Verificar Inno Setup
        run: |
          iscc /?
        shell: cmd

      - name: Criar Instalador com Inno Setup
        run: |
          iscc build/setup.iss
        shell: cmd

      - name: Definir Tag da Release
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.1-manual-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Criar Release no GitHub e Enviar Artefato
        uses: softprops/action-gh-release@v1
        with:
          files: output/FotoKonverter_Setup_v1.0.1.exe
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          name: "FotoKonverter (${{ steps.tag_info.outputs.tag_name }})"
          draft: false
          prerelease: false
        env:
        
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
